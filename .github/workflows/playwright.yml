name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Project (if needed)
        run: |
          # 👇 DODATO - build step ako koristite TypeScript
          npx tsc --noEmit || echo "TypeScript check skipped"

      - name: Run User Journey Tests
        run: npx playwright test tests/full_user_journie.spec.js --shard=${{ matrix.shard }}/2

      - name: Run Lighthouse Tests
        run: |
          # Lighthouse je spor, pa ga možemo ograničiti
          npx playwright test tests/lighthouse-audit.spec.js --project=chromium || echo "Lighthouse tests optional"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
